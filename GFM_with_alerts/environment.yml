name: eodc-dask-client
channels:
  - conda-forge
  - nodefaults

dependencies:
  # match scheduler/workers (py3.12 + dask/distributed 2025.7.0)
  - python=3.12.11
  - tornado=6.5.2
  - lz4=4.4.4

  - pip

  # dask stack
  - dask=2025.7.0
  - distributed=2025.7.0
  - dask-gateway=2025.4.0
  - bokeh=3.8.0

  # core scientific
  - numpy=2.3.3
  - pandas=2.3.2
  - xarray=2025.9.0
  - fsspec=2025.9.0

  # plotting + progress
  - matplotlib
  - tqdm

  # geospatial
  - pyproj=3.7.2
  - proj-data
  - shapely=2.1.1
  - rasterio=1.4.3
  - rioxarray=0.19.0
  - geopandas
  - gdal
  - fiona
  - pyogrio

  # jupyter kernel support
  - ipykernel

  # pip-only (align with scheduler/workers warning table where relevant)

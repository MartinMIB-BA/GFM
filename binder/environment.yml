name: gfm-notebooks
channels:
  - conda-forge

dependencies:
  - python=3.11
  - jupyterlab>=4.0
  - ipykernel>=6.0
  # Core geospatial
  - numpy>=1.24
  - pandas>=2.0
  - xarray>=2023.1
  - geopandas>=0.14
  - shapely>=2.0
  - pyproj>=3.6
  - rasterio>=1.3
  - rioxarray>=0.15
  - fiona>=1.9
  # STAC data access
  - pystac-client>=0.7
  - odc-stac>=0.3
  # Visualization (lightweight)
  - matplotlib>=3.7
  - folium>=0.14
  - ipywidgets>=8.0
  - ipyleaflet>=0.18
  # Image processing
  - pillow>=10.0
  - imageio>=2.31
  # Utilities
  - requests>=2.28
  - tqdm>=4.65
  # leafmap via pip (avoids heavy conda deps like Qt, dask, scipy)
  - pip
  - pip:
    - leafmap

name: gfm-notebooks
channels:
  - conda-forge

dependencies:
  - python=3.11
  - notebook>=7.0
  - ipykernel>=6.0
  - ipywidgets>=8.0
  # Core geospatial (need compiled libs from conda)
  - numpy>=1.24
  - pandas>=2.0
  - xarray>=2023.1
  - geopandas>=0.14
  - shapely>=2.0
  - pyproj>=3.6
  - rasterio>=1.3
  - rioxarray>=0.15
  - fiona>=1.9
  # STAC data access
  - pystac-client>=0.7
  - odc-stac>=0.3
  # Visualization (no Qt backend)
  - matplotlib-base>=3.7
  - folium>=0.14
  - ipyleaflet>=0.18
  # Image processing
  - pillow>=10.0
  - imageio>=2.31
  # Utilities
  - requests>=2.28
  - tqdm>=4.65
  - pip
  - pip:
    # leafmap + maplibre for 3D visualization (lightweight pip install)
    - leafmap
    - maplibre
    - anywidget

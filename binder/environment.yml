name: gfm-notebooks
channels:
  - conda-forge

# Only the WIDGET stack is baked here. Widgets ship a JavaScript frontend
# extension that JupyterLab loads at SERVER START, so it must exist in the
# image at build time (runtime `%pip` cannot register it -> "model not found").
# Pure-compute libraries (shapely, geopandas, rasterio, pystac-client, ...)
# carry no JS and can be installed at runtime with `%pip` + kernel restart.
#
# Pins match the prebuilt labextensions so Python <-> frontend versions agree.
dependencies:
  - python=3.11
  - notebook>=7.0
  - ipykernel>=6.0
  - ipywidgets>=8.0
  - pip
  - pip:
    - ipyleaflet==0.20.0
    - anywidget==0.11.0
    - ipyvuetify==1.11.3
    - ipyvue==1.12.0
    - maplibre
    - leafmap

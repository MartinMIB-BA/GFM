[workspace]
name = "GFM-notebooks"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.11,<3.13"
jupyterlab = ">=4.0"
notebook = ">=7.0"
ipykernel = ">=6.0"

# Core geospatial
numpy = ">=1.24"
pandas = ">=2.0"
xarray = ">=2023.1"
geopandas = ">=0.14"
shapely = ">=2.0"
pyproj = ">=3.6"
rasterio = ">=1.3"
rioxarray = ">=0.15"
fiona = ">=1.9"

# STAC data access
pystac-client = ">=0.7"
odc-stac = ">=0.3"

# Visualization
matplotlib = ">=3.7"
folium = ">=0.14"
leafmap = ">=0.30"
maplibre = ">=0.3"
ipywidgets = ">=8.0"
ipyleaflet = ">=0.18"

# Image / video processing
pillow = ">=10.0"
imageio = ">=2.31"

# Utilities
requests = ">=2.28"
tqdm = ">=4.65"
pixi-kernel = ">=0.7.1,<0.8"
anywidget = ">=0.9,<0.10"

[tasks]
lab = "jupyter lab"
notebook = "jupyter notebook"
